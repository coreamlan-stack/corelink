[package]
name = "corelink"
version = "0.1.0"
description = "CoreLink local Android mirroring workspace"
authors = ["CoreLink contributors"]
edition = "2021"

[lib]
name = "corelink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
