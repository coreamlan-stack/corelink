[package]
name = "corelink"
version = "0.1.0"
description = "CoreLink local Android mirroring workspace"
authors = ["CoreLink contributors"]
edition = "2021"

[lib]
name = "corelink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
rustls = "0.23"
rcgen = "0.13"
qrcodegen = "1.8"
hmac = "0.12"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
